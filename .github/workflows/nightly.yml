name: Nightly

# Nightly scheduled build. Produces two self-contained, portable ZIPs (Windows win-x64 and Linux
# linux-x64) as Actions artifacts. The version is always 0.0.{run_number} (MAJOR/MINOR fixed at 0 via
# the workflow env below); the build number is this workflow run's number (github.run_number). No
# installers are produced and no GitHub Release is published (see release.yml for that).

on:
  schedule:
    # 02:00 UTC every day. Scheduled runs always execute on the default branch (main).
    - cron: '0 2 * * *'
  workflow_dispatch:

env:
  MAJOR: '0'
  MINOR: '0'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Test
        run: dotnet test -c Release

  build:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rid: [ win-x64, linux-x64 ]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version
        id: version
        run: bash .github/scripts/compute-version.sh

      - name: Publish portable (${{ matrix.rid }})
        run: >
          dotnet publish BackupService/BackupService.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:Version=${{ steps.version.outputs.version }} -o portable

      - name: Zip portable build
        run: cd portable && zip -r "../BackupService-portable-${{ matrix.rid }}-${{ steps.version.outputs.version }}.zip" .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: BackupService-portable-${{ matrix.rid }}-${{ steps.version.outputs.version }}
          path: BackupService-portable-${{ matrix.rid }}-${{ steps.version.outputs.version }}.zip
